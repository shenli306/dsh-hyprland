name: windows-installer

# This repository is a patch overlay, not a copy of the monorepo: it carries the
# Linux launcher shell, the packaging patches and the PKGBUILD, and has no
# pnpm-lock.yaml of its own. The Windows artifact is therefore built from the
# upstream tree at the pinned tag, which is also the only supported way to do it
# (apps/desktop/scripts/package-target.ts refuses win32 packaging off-Windows).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the installer under (empty = build artifact only)
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
  UPSTREAM_TAG: dsh-v0.2.2-rc.2

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout upstream at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: src
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install workspace
        working-directory: src
        run: pnpm install --frozen-lockfile

      # package-target.ts refuses to start without apps/desktop/.env.windows; the
      # upstream repository ships only the example (the real one carries release
      # secrets). An unsigned build needs nothing from it.
      - name: Prepare Windows env file
        shell: pwsh
        run: |
          # package-target.ts requires the file and a mandatory-update origin that
          # parses as HTTPS. An unsigned build ships no updater, so a placeholder
          # policy origin is enough; the value only has to be a valid HTTPS origin.
          @"
          DSH_DESKTOP_APP_ID=com.deepseek.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://policy.example.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://policy.example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.com"]}
          "@ | Set-Content -Encoding utf8 src/apps/desktop/.env.windows
          Get-Content src/apps/desktop/.env.windows

      - name: Package win-x64 (unsigned)
        working-directory: src
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64 --unsigned

      - name: List artifacts
        shell: pwsh
        run: |
          # Unsigned builds land in targets/win-x64/unsigned-artifacts (electron-builder
          # keeps signed and unsigned outputs apart), so resolve the directory instead
          # of assuming its name.
          $root = "src/apps/desktop/.desktop-build/targets/win-x64"
          $exe = Get-ChildItem -Recurse -Filter *.exe $root | Where-Object { $_.Name -notlike '*unins*' }
          if (-not $exe) { throw "no installer found under $root" }
          $exe | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-win-x64-unsigned
          path: src/apps/desktop/.desktop-build/targets/win-x64/**/*.exe
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: DeepSeek Harness ${{ env.UPSTREAM_TAG }} (Windows x64)
          body: |
            Windows x64 build of DeepSeek Harness ${{ env.UPSTREAM_TAG }}, unsigned.

            Built from ${{ env.UPSTREAM_REPOSITORY }}@${{ env.UPSTREAM_TAG }} on a
            Windows runner, because the upstream packaging scripts refuse to
            cross-build win32.

            The Hyprland launcher shell in this repository is Linux/Wayland only
            and is not part of this artifact; on Windows the app uses the upstream
            Electron entry point.

            The installer is unsigned: SmartScreen will warn on first run.
          files: src/apps/desktop/.desktop-build/targets/win-x64/**/*-unsigned.exe
          fail_on_unmatched_files: false
