name: windows-installer

# win-x64 cannot be cross-built: apps/desktop/scripts/package-target.ts:201 refuses
# to package win32 from a non-Windows host. So the Windows installer is produced on
# a Windows runner here, from the same tree, and published as a release asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the installer under (empty = build artifact only)
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Package win-x64 (unsigned)
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64 --unsigned

      - name: List artifacts
        shell: pwsh
        run: |
          $root = "apps/desktop/.desktop-build/targets/win-x64/artifacts"
          if (Test-Path $root) {
            Get-ChildItem -Recurse $root | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Get-ChildItem -Recurse -Include *.exe,*.zip,*.7z apps/desktop/.desktop-build |
              Select-Object FullName, Length | Format-Table -AutoSize
            throw "expected artifacts directory not found: $root"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts/**
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: DSH ${{ inputs.tag || github.ref_name }}
          body: |
            Windows x64 build of DeepSeek Harness (unsigned).

            Built from ${{ github.sha }} on a Windows runner. The Linux/Wayland
            Hyprland shell is not part of this artifact: it is a Linux-only
            launcher and the Windows build uses the upstream Electron desktop
            entry point.

            The installer is unsigned, so SmartScreen will warn on first run.
          files: apps/desktop/.desktop-build/targets/win-x64/artifacts/**/*.exe
          fail_on_unmatched_files: false
